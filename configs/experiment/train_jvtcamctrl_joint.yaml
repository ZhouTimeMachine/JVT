# @package _global_

defaults:
  - override /dataset: realestate10k
  - override /algorithm: camctrl_denoiser
  - override /trainer: default
  - override /algorithm/backbone: jvt_camctrl_joint

name: train_jvtcamctrl_re10k_joint

dataset:
  subdataset_size: 600000
  observation_shape: [4, "${dataset.resolution}", "${dataset.resolution}"]
  data_mean: [[[0.577]], [[0.517]], [[0.461]], [[0.5]]]
  data_std: [[[0.249]], [[0.249]], [[0.268]], [[0.25]]]

algorithm:
  online_disparity:
    enable: true

trainer:
  max_epoches: 120
  save_freq: 4

  optimizer:
    # lr: 5e-5
    lr: 8e-5
    betas: [0.9, 0.99]
    weight_decay: 0.01

  lr_scheduler:
    name: constant_with_warmup
    # num_warmup_steps: 10000
    num_warmup_steps: 1000
    # num_training_steps: 550000
    num_training_steps: 60000
