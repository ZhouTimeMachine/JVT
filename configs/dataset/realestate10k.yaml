defaults:
  - default
  - _self_

name: realestate10k
save_dir: data/re10k
metadata_file: ${dataset.save_dir}/metadata/train_256.pt
max_frames: 8
frame_skip: 20
resolution: 256
data_mean: [[[0.577]], [[0.517]], [[0.461]]]
data_std: [[[0.249]], [[0.249]], [[0.268]]]
subdataset_size: ???
maximize_training_data: true
augmentation:
  frame_skip_increase: 1     # increase frame skip by this amount each subepoch
  horizontal_flip_prob: 0.5  # probability of horizontally flipping the video
  reverse_prob: 0.5          # probability of reversing the video
  back_and_forth_prob: 0.1   # probability of playing the video back and forth
