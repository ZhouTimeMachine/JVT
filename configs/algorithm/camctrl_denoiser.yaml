defaults:
  - backbone: jvt_camctrl
  - _self_

name: camctrl_denoiser

camera_pose_conditioning:
  normalize_by: first # first, mean
  bound: null # float to scale the camera positions to [-bound, bound]^3
  type: full # full (intrinsics + extrinsics), extrinsics_only

noise_sampling:
  shift: 4

device: cuda
backbone:
  camera_mode: ${algorithm.camera_pose_conditioning.type}
diffusion:
  shift: ${algorithm.noise_sampling.shift}
  t_eps: 5e-3
  timesteps: 1000
  clip_noise: 20.0
  sampling_timesteps: 50

history_guidance_scale: 4.0
context_frames: 1
sliding_context_len: null  # set to 4 if chunk-wise autoregressive generation is necessary

online_disparity:
  enable: false
  ckpt: checkpoints/Pi3X/model.safetensors
  crop_size: 252

# dataset-dependent configurations
x_shape: ${dataset.observation_shape}
max_frames: ${dataset.max_frames}
data_mean: ${dataset.data_mean}
data_std: ${dataset.data_std}
