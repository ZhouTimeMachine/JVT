# @package _global_

defaults:
  - override /algorithm: dit_video_uncond
  - override /algorithm/backbone: jvt_uncond

batch_size: 8
resume: null

name: null
epoch: null
output_dir: outputs/${name}/epoch_${epoch}

# dataset-dependent configurations
dataset:
  observation_shape: [3, 256, 256]
  max_frames: 16
  frame_skip: 3
  data_mean: [[[0.5]], [[0.5]], [[0.5]]]
  data_std: [[[0.5]], [[0.5]], [[0.5]]]
  num_classes: 0  # for unconditional

# default sampling settings
num_samples: 2048
algorithm:
  diffusion:
    sampling_method: heun
    sampling_timesteps: 50
  rg_scale: null
