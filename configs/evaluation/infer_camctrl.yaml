# @package _global_

defaults:
  - override /algorithm: camctrl_denoiser
  - override /algorithm/backbone: jvt_camctrl

resume: null

name: null
epoch: null
output_dir: outputs/${name}/epoch_${epoch}

# visualization
save_real_video: false
depth_vis_mode: color
pointcloud:
  filter_depth_edges: false
  filter_depth_normal_edges: false
  depth_edge_rtol: 0.03
  depth_edge_atol: null
  depth_edge_kernel_size: 3
  normal_edge_tol_deg: 5

algorithm:
  # dataset-dependent configurations
  x_shape: [3, 256, 256]
  max_frames: 8
  data_mean: [[[0.577]], [[0.517]], [[0.461]]]
  data_std: [[[0.249]], [[0.249]], [[0.268]]]
  online_disparity:
    enable: false

dataset:  # RealEstate10KEvalVideoDataset
  Re10K_EVAL_VIDEO_DIR: data/re10k/test_256
  Re10K_EVAL_POSE_DIR: data/re10k/test_poses
  resolution: [256, 256]  # (width, height)
  num_frames: 8
  # cache_file: data/metadata/re10k_test1745_${dataset.resolution[0]}x${dataset.resolution[1]}_seq${dataset.num_frames}_cache.npy,
  cache_file: null
  seq_file: evaluation/dataset/sequences/re10k_test_1832.txt
  seq_id_map: evaluation/dataset/seq-id-maps/re10k_test1745_256x256_seq8_id_map.json
  video_is_sampled_clip: false

dataloader:
  batch_size: 8
  num_workers: 4
  pin_memory: false