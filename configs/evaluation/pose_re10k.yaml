# @package _global_

name: eval_pose_re10k
# output_dir: outputs/${name}
addi_keys:
  method: jvt
  epoch: null
save_suffix: ${addi_keys.method}

pretrained_model_name_or_path: checkpoints/Pi3X/model.safetensors

metric_thresholds: [1, 3, 5, 10, 15, 30]

dataset:  # RealEstate10KEvalVideoDataset
  Re10K_EVAL_VIDEO_DIR: data/re10k/test_256
  Re10K_EVAL_POSE_DIR: data/re10k/test_poses
  resolution: [252, 252]  # (width, height), 256 // 14 * 14 = 252, (256, 256) -> (252, 252)
  num_frames: 8
  # cache_file: data/metadata/re10k_test1745_${dataset.resolution[0]}x${dataset.resolution[1]}_seq${dataset.num_frames}_cache.npy,
  cache_file: null
  seq_file: evaluation/dataset/sequences/re10k_test_1832.txt
  seq_id_map: evaluation/dataset/seq-id-maps/re10k_test1745_256x256_seq8_id_map.json
  video_is_sampled_clip: true

dataloader:
  batch_size: 8
  num_workers: 4
  pin_memory: false